<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xmark Specialist</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(92%, 520px);
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #aeb3c2;
    }

    .card {
      margin-top: 25px;
      padding: 25px;
      background: #11131a;
      border: 1px solid #292c38;
      border-radius: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #30333e;
      border-radius: 10px;
      background: #08090d;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #dashboard {
      display: none;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main class="container">

  <h1>Xmark Specialist</h1>
  <p>Private owner control panel</p>

  <section id="login" class="card">
    <h2>Owner Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Owner email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Sign In
    </button>

    <div id="message"></div>
  </section>

  <section id="dashboard" class="card">
    <h2>Owner Dashboard</h2>

    <p id="ownerEmail"></p>
    <p>● Owner authentication active</p>

    <button onclick="logout()">
      Log Out
    </button>
  </section>

</main>

<script>

    IMPORTANT:
    Replace ONLY these two values.

    SUPABASE_URL:
      Use the API/Project URL you copied.

    SUPABASE_PUBLISHABLE_KEY:
      Use your existing sb_... PUBLISHABLE key.

    NEVER put a secret/service-role key here.
  */

  const SUPABASE_URL = "PASTE_YOUR_API_URL_HERE";

  const SUPABASE_PUBLISHABLE_KEY =
    "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    if (!email || !password) {
      message.textContent =
        "Enter your owner email and password.";
      return;
    }

    message.textContent = "Signing in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      message.textContent =
        "Access denied.";
      return;
    }

    showDashboard(data.user);
  }
