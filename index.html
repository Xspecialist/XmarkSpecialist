<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xmark Specialist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(90%, 700px);
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 80px);
      margin: 0;
    }

    p {
      color: #aeb3c2;
      font-size: 17px;
      line-height: 1.6;
    }

    .panel {
      margin-top: 30px;
      padding: 25px;
      border: 1px solid #292c38;
      border-radius: 18px;
      background: #11131a;
    }

    .status {
      color: #72f0a3;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Xmark Specialist</h1>

    <p>
      Welcome to the official Xmark Specialist website.
    </p>

    <section class="panel">
      <h2>System Status</h2>

      <div class="status">
        ● ONLINE
      </div>

      <p>
        Owner authentication is currently being configured.
      </p>

      <button onclick="showStatus()">
        Check Status
      </button>
    </section>

  </main>

  <script>
    function showStatus() {
      alert("Xmark Specialist is online.");
    }
  </script>

</body>
</html>
