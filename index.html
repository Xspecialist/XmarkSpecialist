<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xmark Specialist</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;

  background-image: url("https://cdn.phototourl.com/member/2026-09-26-b017d731-e30b-46ce-96d8-77fc0699a68c.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  color: white;
  font-family: Arial, sans-serif;
}

    .container {
      width: min(92%, 520px);
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #aeb3c2;
    }

    .card {
      margin-top: 25px;
      padding: 25px;
      background: #11131a;
      border: 1px solid #292c38;
      border-radius: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #30333e;
      border-radius: 10px;
      background: #08090d;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #dashboard {
      display: none;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main class="container">

  <h1>Xmark Specialist</h1>
  <p>Private owner control panel</p>

  <section id="login" class="card">
    <h2>Owner Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Owner email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">
      Sign In
    </button>

    <div id="message"></div>
  </section>

  <section id="dashboard" class="card">
    <h2>Owner Dashboard</h2>
    <p id="ownerEmail"></p>
    <p>● Owner authentication active</p>

    <button onclick="logout()">
      Log Out
    </button>
  </section>

</main>

<script>
  // PUT YOUR SUPABASE DETAILS HERE
  const SUPABASE_URL = "https://plaentuiwnovqnsispac.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ZMCPtsXWS9H3utBJdGmIoA_MLC7ykrF";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    if (!email || !password) {
      message.textContent = "Enter your owner email and password.";
      return;
    }

    button.disabled = true;
    message.textContent = "Signing in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    button.disabled = false;

    if (error) {
      message.textContent = "Access denied: " + error.message;
      return;
    }

    showDashboard(data.user);
  }

  function showDashboard(user) {
    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    document.getElementById("ownerEmail").textContent =
      "Logged in as: " + user.email;
  }

  async function logout() {
    await supabaseClient.auth.signOut();

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login").style.display = "block";
    document.getElementById("message").textContent = "";
  }

  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      showDashboard(data.session.user);
    }
  }

  checkSession();
</script>

</body>
</html>
